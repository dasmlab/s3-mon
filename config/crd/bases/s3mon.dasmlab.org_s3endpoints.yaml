---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: s3endpoints.s3mon.dasmlab.org
spec:
  group: s3mon.dasmlab.org
  names:
    kind: S3Endpoint
    listKind: S3EndpointList
    plural: s3endpoints
    shortNames:
    - s3e
    singular: s3endpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .status.observedBuckets
      name: Buckets
      type: integer
    - jsonPath: .status.lastSuccessTime
      name: LastSuccess
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: S3Endpoint is the Schema for the s3endpoints API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: S3EndpointSpec defines the desired state of S3Endpoint.
            properties:
              buckets:
                description: Buckets limits scraping to named buckets. Empty = discover
                  all via ListBuckets.
                items:
                  type: string
                type: array
              credentialsSecretRef:
                description: |-
                  CredentialsSecretRef points at a Secret holding S3 connection details.
                  Preferred keys (Thanos-style, all in one secret):
                    endpoint, access_key, secret_key, region, insecure, forcePathStyle
                  Also accepted: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, and a YAML
                  `config` blob (Thanos objstore shape).
                properties:
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              endpoint:
                description: Endpoint overrides the secret endpoint (host[:port],
                  no scheme).
                type: string
              folderDepth:
                default: 3
                description: |-
                  FolderDepth controls how deep "folder" (prefix) enumeration goes.
                  Depth 1 = top-level prefixes only; depth 3 walks three levels.
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              forcePathStyle:
                description: ForcePathStyle forces path-style addressing (required
                  by many MinIO setups).
                type: boolean
              insecure:
                description: Insecure allows HTTP (useful for MinIO / lab endpoints).
                type: boolean
              interval:
                default: 5m
                description: Interval between scrapes. Defaults to 5m.
                type: string
              region:
                default: us-east-1
                description: Region to pass to the S3 SDK (default us-east-1).
                type: string
              suspend:
                default: false
                description: Suspend stops scraping when true.
                type: boolean
            required:
            - credentialsSecretRef
            type: object
          status:
            description: S3EndpointStatus defines the observed state of S3Endpoint.
            properties:
              conditions:
                description: Conditions of the scrape loop.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastScrapeTime:
                description: LastScrapeTime is the last completed scrape (success
                  or failure).
                format: date-time
                type: string
              lastSuccessTime:
                description: LastSuccessTime is the last successful scrape.
                format: date-time
                type: string
              message:
                description: Message is a short human-readable scrape summary.
                type: string
              observedBuckets:
                description: ObservedBuckets is the count of buckets seen on the last
                  successful scrape.
                format: int32
                type: integer
              ready:
                description: Ready is true after at least one successful scrape.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
