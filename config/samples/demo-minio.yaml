# Demo: Adobe S3Mock + Secret + S3Endpoint (works offline; quay/minio pulls blocked here).
apiVersion: v1
kind: Namespace
metadata:
  name: s3-mon-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-minio-creds
  namespace: s3-mon-demo
type: Opaque
stringData:
  # Thanos-style discrete keys (preferred)
  endpoint: s3mock.s3-mon-demo.svc.cluster.local:9090
  access_key: test
  secret_key: test
  region: us-east-1
  insecure: "true"
  forcePathStyle: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3mock
  namespace: s3-mon-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3mock
  template:
    metadata:
      labels:
        app: s3mock
    spec:
      containers:
        - name: s3mock
          image: adobe/s3mock:3.12.0
          imagePullPolicy: IfNotPresent
          env:
            - name: initialBuckets
              value: demo-bucket,logs-bucket
            - name: root
              value: /tmp/s3
          ports:
            - containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: s3mock
  namespace: s3-mon-demo
spec:
  selector:
    app: s3mock
  ports:
    - name: s3
      port: 9090
      targetPort: 9090
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3mock-seed
  namespace: s3-mon-demo
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: amazon/aws-cli:2.17.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -c
            - |
              set -e
              EP=http://s3mock:9090
              until aws --endpoint-url="$EP" s3 ls; do sleep 2; done
              echo hello > /tmp/a.txt
              aws --endpoint-url="$EP" s3 cp /tmp/a.txt s3://demo-bucket/top1/a.txt
              aws --endpoint-url="$EP" s3 cp /tmp/a.txt s3://demo-bucket/top1/nested/b.txt
              aws --endpoint-url="$EP" s3 cp /tmp/a.txt s3://demo-bucket/top2/c.txt
              aws --endpoint-url="$EP" s3 cp /tmp/a.txt s3://logs-bucket/app/2026/x.txt
              aws --endpoint-url="$EP" s3 ls --recursive s3://demo-bucket
              echo seeded
---
apiVersion: s3mon.dasmlab.org/v1alpha1
kind: S3Endpoint
metadata:
  name: demo-minio
  namespace: s3-mon-demo
spec:
  credentialsSecretRef:
    name: demo-minio-creds
  interval: 30s
  folderDepth: 3
  insecure: true
  forcePathStyle: true
  region: us-east-1
