          kind: ConfigurationPolicy
          name: hub-s3-mon-crd
          compliance: Compliant
      objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: hub-s3-mon-config
        spec:
          remediationAction: enforce
          severity: medium
          pruneObjectBehavior: DeleteIfCreated
          object-templates:
            # 1) Namespace
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: s3-mon
                  labels:
                    app: s3-mon

            # 2) ServiceAccount
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: s3-mon-controller
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                  annotations:
                    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"s3-mon"}}'

            # 3) ClusterRole — S3Endpoints in any namespace + the Secrets they reference
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: s3-mon-manager-role
                  labels:
                    app: s3-mon
                rules:
                  - apiGroups: ["s3mon.dasmlab.org"]
                    resources: ["s3endpoints"]
                    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                  - apiGroups: ["s3mon.dasmlab.org"]
                    resources: ["s3endpoints/status"]
                    verbs: ["get", "update", "patch"]
                  - apiGroups: ["s3mon.dasmlab.org"]
                    resources: ["s3endpoints/finalizers"]
                    verbs: ["update"]
                  - apiGroups: [""]
                    resources: ["secrets"]
                    verbs: ["get", "list", "watch"]
                  - apiGroups: [""]
                    resources: ["events"]
                    verbs: ["create", "patch"]

            # 4) ClusterRoleBinding
            - complianceType: musthave
              objectDefinition:
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: s3-mon-manager-rolebinding
                  labels:
                    app: s3-mon
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: s3-mon-manager-role
                subjects:
                  - kind: ServiceAccount
                    name: s3-mon-controller
                    namespace: s3-mon

            # 4b) CA bundles for HTTPS S3 endpoints, filled in by OpenShift and added to the manager's trust store:
            #     trusted-ca = system roots + proxy/cluster spec.trustedCA; service-ca = *.svc certs (e.g. ODF/NooBaa).
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: s3-mon-trusted-ca
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                    config.openshift.io/inject-trusted-cabundle: "true"
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: s3-mon-service-ca
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                  annotations:
                    service.beta.openshift.io/inject-cabundle: "true"

            # 5) Deployment
            - complianceType: musthave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: s3-mon-controller
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: s3-mon
                  template:
                    metadata:
                      labels:
                        app: s3-mon
                    spec:
                      serviceAccountName: s3-mon-controller
                      securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                          type: RuntimeDefault
                      containers:
                        - name: manager
                          image: ghcr.io/dasmlab/s3-mon:v0.2.3
                          imagePullPolicy: IfNotPresent
                          args:
                            - --metrics-bind-address=0
                            - --http-bind-address=:8090
                            - --ui-bind-address=127.0.0.1:8091
                            - --health-probe-bind-address=:8081
                            - --leader-elect=false
                          env:
                            - name: SSL_CERT_DIR
                              value: /etc/ssl/certs:/etc/pki/s3-mon/trusted-ca:/etc/pki/s3-mon/service-ca
                          volumeMounts:
                            - name: trusted-ca
                              mountPath: /etc/pki/s3-mon/trusted-ca
                              readOnly: true
                            - name: service-ca
                              mountPath: /etc/pki/s3-mon/service-ca
                              readOnly: true
                          ports:
                            - name: http
                              containerPort: 8090
                              protocol: TCP
                            - name: health
                              containerPort: 8081
                              protocol: TCP
                          readinessProbe:
                            httpGet:
                              path: /readyz
                              port: health
                            initialDelaySeconds: 5
                            periodSeconds: 10
                          livenessProbe:
                            httpGet:
                              path: /healthz
                              port: health
                            initialDelaySeconds: 15
                            periodSeconds: 20
                          securityContext:
                            readOnlyRootFilesystem: true
                            allowPrivilegeEscalation: false
                            capabilities:
                              drop: ["ALL"]
                          resources:
                            requests:
                              cpu: 50m
                              memory: 64Mi
                            limits:
                              cpu: 500m
                              memory: 256Mi
                        # No `lookup` of the openshift/oauth-proxy ImageStreamTag here: the policy controller
                        # watches looked-up resources and ImageStreamTags cannot be watched, which stalls evaluation.
                        - name: oauth-proxy
                          image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9:v4.20
                          imagePullPolicy: IfNotPresent
                          args:
                            - --provider=openshift
                            - --https-address=:8443
                            - --http-address=
                            - --upstream=http://127.0.0.1:8091
                            - --openshift-service-account=s3-mon-controller
                            - --tls-cert=/etc/tls/private/tls.crt
                            - --tls-key=/etc/tls/private/tls.key
                            # HMAC key for session cookies; the service-ca private key is per-cluster and
                            # only readable by those who can read secrets in s3-mon.
                            - --cookie-secret-file=/etc/tls/private/tls.key
                            - --cookie-secure=true
                            - '--openshift-sar={"group":"s3mon.dasmlab.org","resource":"s3endpoints","verb":"create"}'
                          ports:
                            - name: https
                              containerPort: 8443
                              protocol: TCP
                          readinessProbe:
                            httpGet:
                              path: /oauth/healthz
                              port: https
                              scheme: HTTPS
                            initialDelaySeconds: 5
                            periodSeconds: 10
                          livenessProbe:
                            httpGet:
                              path: /oauth/healthz
                              port: https
                              scheme: HTTPS
                            initialDelaySeconds: 15
                            periodSeconds: 20
                          securityContext:
                            allowPrivilegeEscalation: false
                            capabilities:
                              drop: ["ALL"]
                          volumeMounts:
                            - name: proxy-tls
                              mountPath: /etc/tls/private
                              readOnly: true
                          resources:
                            requests:
                              cpu: 10m
                              memory: 32Mi
                            limits:
                              memory: 128Mi
                      volumes:
                        - name: proxy-tls
                          secret:
                            secretName: s3-mon-tls
                        - name: trusted-ca
                          configMap:
                            name: s3-mon-trusted-ca
                            optional: true
                        - name: service-ca
                          configMap:
                            name: s3-mon-service-ca
                            optional: true

            # 6) Service — metrics on http (in-cluster only), UI/API via oauth-proxy on https.
            #    service-ca issues the s3-mon-tls serving cert used by the proxy and trusted by the router.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: s3-mon
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                  annotations:
                    service.beta.openshift.io/serving-cert-secret-name: s3-mon-tls
                spec:
                  selector:
                    app: s3-mon
                  ports:
                    - name: http
                      port: 8090
                      targetPort: http
                      protocol: TCP
                    - name: https
                      port: 8443
                      targetPort: https
                      protocol: TCP

            # 6b) Route — OpenShift login in front of the UI/API
            - complianceType: musthave
              objectDefinition:
                apiVersion: route.openshift.io/v1
                kind: Route
                metadata:
                  name: s3-mon
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                spec:
                  to:
                    kind: Service
                    name: s3-mon
                    weight: 100
                  port:
                    targetPort: https
                  tls:
                    termination: reencrypt
                    insecureEdgeTerminationPolicy: Redirect
                  wildcardPolicy: None

            # 7) ServiceMonitor (User Workload Monitoring)
            #    honorLabels keeps the metric's own `endpoint` label (the S3Endpoint name);
            #    without it Prometheus overwrites it with the scrape port name.
            - complianceType: musthave
              objectDefinition:
                apiVersion: monitoring.coreos.com/v1
                kind: ServiceMonitor
                metadata:
                  name: s3-mon
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                spec:
                  selector:
                    matchLabels:
                      app: s3-mon
                  endpoints:
                    - port: http
                      path: /metrics
                      interval: 60s
                      honorLabels: true

            # 8) MCO allowlist — metrics-collector only forwards allowlisted UWM series to the hub Thanos.
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: observability-metrics-custom-allowlist
                  namespace: s3-mon
                  labels:
                    app: s3-mon
                data:
                  uwl_metrics_list.yaml: |
                    names:
                      - s3mon_bucket_size_bytes
                      - s3mon_bucket_objects
                      - s3mon_folder_count
                      - s3mon_prefix_size_bytes
                      - s3mon_prefix_objects
                      - s3mon_scrape_success
                      - s3mon_scrape_duration_seconds
                      - s3mon_last_scrape_timestamp

