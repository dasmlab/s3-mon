name: s3-mon CI

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dasmlab/s3-mon
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Generate manifests (CRDs) for artifact
        run: |
          set -euo pipefail
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.18.0
          make manifests generate
          mkdir -p dist/crds
          cp -a config/crd/bases/. dist/crds/

      - name: Test
        run: go test ./...

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME}"
          elif [[ -f .localbuild ]]; then
            VER="v$(tr -d '[:space:]' < .localbuild)"
          else
            VER="v0.0.0"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${VER}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload CRDs
        uses: actions/upload-artifact@v4
        with:
          name: s3-mon-crds-${{ steps.ver.outputs.version }}
          path: dist/crds/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag_sha }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
